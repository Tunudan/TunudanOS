# Écran de connexion Linux Mint (slick-greeter) aux couleurs Tunudan
[Greeter]
background=/usr/share/backgrounds/tunudan/origami/origami-grue-sombre.png
background-color=#0D0D0D
draw-user-backgrounds=false
draw-grid=false
theme-name=Tunudan
icon-theme-name=Tunudan
cursor-theme-name=Tunudan-cursors
cursor-theme-size=24
font-name=Inter 11
logo=/usr/share/tunudan/login/tunudan-wordmark.png
show-hostname=true
show-a11y=true
show-keyboard=true
show-clock=true
clock-format=%H:%M
