# Écran de connexion LightDM (GTK) aux couleurs Tunudan
[greeter]
background=/usr/share/backgrounds/tunudan/origami/origami-grue-sombre.png
theme-name=Tunudan
icon-theme-name=Tunudan
cursor-theme-name=Tunudan-cursors
cursor-theme-size=24
font-name=Inter 12
default-user-image=/usr/share/pixmaps/tunudan/tunudan-128.png
indicators=~host;~spacer;~clock;~spacer;~a11y;~session;~power
clock-format=%A %d %B  %H:%M
position=50%,center 50%,center
