# Thème Tunudan — généré par themes/build.py, ne pas modifier à la main — barre i3 aux couleurs Tunudan
# Remplace votre bloc « bar { … } » par celui-ci (l'installateur le propose).
bar {
    status_command i3status -c ~/.config/i3status/tunudan.conf
    position top
    font pango:Inter, JetBrains Mono 10
    tray_padding 4
    colors {
        background #0D0D0D
        statusline #F5F1EA
        separator  #2A2A2C
        #                  bordure  fond     texte
        focused_workspace  #FF6B1A #FF6B1A #0D0D0D
        active_workspace   #2A2A2C #2A2A2C #F5F1EA
        inactive_workspace #0D0D0D #0D0D0D #8A857E
        urgent_workspace   #ED553B #ED553B #0D0D0D
        binding_mode       #FF9A5C #FF9A5C #0D0D0D
    }
}
