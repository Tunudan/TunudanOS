# Thème Tunudan — généré par themes/build.py, ne pas modifier à la main
# Hyprland 0.54 et avant (hyprlang).
# Chargé depuis ~/.config/hypr/hyprland.conf par : source = ~/.config/hypr/tunudan.conf

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border = rgba(ff6b1aff) rgba(ff9a5cff) 45deg
    col.inactive_border = rgba(2a2a2cff)
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.96
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000099)
    }
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    background_color = rgba(0d0d0dff)
}

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Tunudan-cursors
env = QT_QPA_PLATFORMTHEME,qt6ct

exec-once = hyprpaper
exec-once = waybar -c ~/.config/waybar/tunudan-hyprland.jsonc -s ~/.config/waybar/tunudan.css
exec-once = mako --config ~/.config/mako/tunudan
