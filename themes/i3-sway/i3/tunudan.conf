# Thème Tunudan — généré par themes/build.py, ne pas modifier à la main — i3 (≥ 4.22)
# Inclus depuis ~/.config/i3/config par : include ~/.config/i3/tunudan.conf

font pango:Inter Bold 10
default_border pixel 2
default_floating_border pixel 2
gaps inner 8
gaps outer 4
smart_gaps on

# class                 bordure  fond     texte    indicateur bordure_enfant
client.focused          #FF6B1A #FF6B1A #0D0D0D #FF9A5C    #FF6B1A
client.focused_inactive #2A2A2C #1C1C1E #F5F1EA #2A2A2C    #2A2A2C
client.unfocused        #141416 #141416 #8A857E #141416    #141416
client.urgent           #ED553B #ED553B #0D0D0D #ED553B    #ED553B
client.placeholder      #0D0D0D #0D0D0D #F5F1EA #0D0D0D    #0D0D0D
client.background       #0D0D0D

# Fond d'écran et notifications
exec_always --no-startup-id feh --no-fehbg --bg-fill "$HOME/.local/share/backgrounds/tunudan/origami/origami-grue-sombre.png"
exec --no-startup-id dunst

# Lanceur aux couleurs Tunudan : rofi -show drun -theme ~/.config/rofi/tunudan.rasi
