# Calamares : choix du bureau (édition Avancé de Tunudan OS).
# Le choix est rangé dans packagechooser_desktop, lu par contextualprocess@desktop.
---
mode: required
method: legacy
labels:
    step: "Bureau"
    step[fr]: "Bureau"
default: xfce
items:
    - id: xfce
      name: "Xfce"
      description: "Léger, rapide et simple. Une barre en bas, tout est à portée de main. (déjà sur la clé : installation la plus rapide)"
      screenshot: "/usr/share/tunudan/desktops/xfce.png"
    - id: gnome
      name: "GNOME"
      description: "Moderne et épuré : une barre en haut, les applications en plein écran avec la touche Super. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/gnome.png"
    - id: plasma
      name: "KDE Plasma"
      description: "Complet et personnalisable à l'infini, avec de beaux effets. Barre en bas comme Windows. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/plasma.png"
    - id: cinnamon
      name: "Cinnamon"
      description: "Le bureau de Linux Mint : menu en bas à gauche, très proche de Windows. Idéal pour débuter. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/cinnamon.png"
    - id: mate
      name: "MATE"
      description: "Classique et économe : deux barres (menus en haut, fenêtres en bas). Parfait pour les ordinateurs anciens. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/mate.png"
    - id: lxqt
      name: "LXQt"
      description: "Ultra-léger, basé sur Qt. Pour les petites configurations. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/lxqt.png"
    - id: budgie
      name: "Budgie"
      description: "Élégant et simple, avec un panneau latéral pour les notifications et réglages rapides. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/budgie.png"
    - id: sway
      name: "Sway"
      description: "Mosaïque Wayland sobre et stable, compatible i3. Tout au clavier. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/sway.png"
    - id: i3
      name: "i3"
      description: "Le classique de la mosaïque sous X11 : minimaliste, rapide, entièrement au clavier. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/i3.png"
    - id: hyprland
      name: "Hyprland"
      description: "Gestionnaire en mosaïque très animé : flou, coins arrondis, tout au clavier. Pour experts. (téléchargé pendant l'installation : Internet nécessaire)"
      screenshot: "/usr/share/tunudan/desktops/hyprland.png"
