# Calamares : installe le bureau choisi une fois le système copié.
# install-desktop tourne depuis la session live (dontChroot) et gère lui-même le chroot,
# le DNS et les erreurs : il ne fait jamais échouer l'installation.
---
dontChroot: true
timeout: 3600
packagechooser_desktop:
    xfce:
        - command: "/usr/lib/tunudan/install-desktop xfce --target ${ROOT} --distro debian"
          timeout: 3600
    gnome:
        - command: "/usr/lib/tunudan/install-desktop gnome --target ${ROOT} --distro debian"
          timeout: 3600
    plasma:
        - command: "/usr/lib/tunudan/install-desktop plasma --target ${ROOT} --distro debian"
          timeout: 3600
    cinnamon:
        - command: "/usr/lib/tunudan/install-desktop cinnamon --target ${ROOT} --distro debian"
          timeout: 3600
    mate:
        - command: "/usr/lib/tunudan/install-desktop mate --target ${ROOT} --distro debian"
          timeout: 3600
    lxqt:
        - command: "/usr/lib/tunudan/install-desktop lxqt --target ${ROOT} --distro debian"
          timeout: 3600
    budgie:
        - command: "/usr/lib/tunudan/install-desktop budgie --target ${ROOT} --distro debian"
          timeout: 3600
    sway:
        - command: "/usr/lib/tunudan/install-desktop sway --target ${ROOT} --distro debian"
          timeout: 3600
    i3:
        - command: "/usr/lib/tunudan/install-desktop i3 --target ${ROOT} --distro debian"
          timeout: 3600
    hyprland:
        - command: "/usr/lib/tunudan/install-desktop hyprland --target ${ROOT} --distro debian"
          timeout: 3600
